<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f1f2f6">
<title>Tapis Poker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Mise en page : appli sur un écran — barre fine en haut, table ovale qui remplit le milieu, zone d'action sombre fixée en bas.
     Thème clair assumé (salle lumineuse, tapis turquoise, plaques sombres, rouge pour agir) : pas de variante sombre. */
  --bg:#f1f2f6;
  --text:#1b2132;
  --plate:#232a3b;
  --plate-2:#343d53;
  --line:#434d66;
  --felt:#31a39c;
  --felt-deep:#1d7f7c;
  --rail:#262d3f;
  --accent:#ffc928;
  --red:#d9263d;
  --red-deep:#b3152c;
  --white:#fff;
  --mute:#6a7388;
  --mute-on-dark:#aeb6c8;
  --f-display:"Bricolage Grotesque","Trebuchet MS","Segoe UI",sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --podw:80px;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{touch-action:manipulation;background:radial-gradient(70% 42% at 0% 0%,#ffe9a6 0%,rgba(255,233,166,0) 70%),radial-gradient(60% 36% at 100% 100%,#ffe3a0 0%,rgba(255,227,160,0) 70%),var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.4;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2.5px solid var(--red);outline-offset:2px}
.view{height:100%;display:flex;flex-direction:column;max-width:920px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}

/* ---------- Marque ---------- */
.mark{font-family:var(--f-display);font-weight:800;font-variation-settings:"wdth" 78;letter-spacing:-.035em;line-height:.9;color:var(--text)}
.mark i{font-style:normal;color:var(--red)}

/* ---------- Accueil ---------- */
#home{overflow-y:auto;max-width:none}
.home-in{width:100%;max-width:430px;margin:0 auto;padding:26px 20px 34px;display:flex;flex-direction:column;gap:16px}
.fan{position:relative;height:112px;margin:10px 0 26px}
.fan .card{position:absolute;left:50%;bottom:0;--cw:62px;margin-left:-31px;transform-origin:50% 100%;box-shadow:0 0 0 1px rgba(27,33,50,.1),0 10px 22px rgba(27,33,50,.22)}
.home-in h1{font-size:84px;text-align:center;margin-top:2px}
.tag{text-align:center;color:var(--mute);font-size:16px;text-wrap:balance;max-width:30ch;margin:0 auto 4px}
.panel{background:var(--white);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 0 rgba(27,33,50,.06),0 12px 28px -12px rgba(27,33,50,.25)}
label{font-size:13px;font-weight:600;color:var(--mute)}
input[type=text]{background:var(--white);color:var(--text);border:1.5px solid #cfd4df;border-radius:12px;padding:13px 14px;font-size:17px;width:100%;min-width:0}
input[type=text]::placeholder{color:#a2a9b8}
.inline{display:flex;gap:8px}
.inline .btn{flex:none;padding-inline:18px}
.fine{font-size:13px;color:var(--mute);text-align:center;text-wrap:balance}
.link{background:none;border:0;color:var(--red);font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:0;font-size:inherit}

/* ---------- Boutons ---------- */
.btn{appearance:none;border:0;border-radius:12px;padding:12px 10px;min-height:52px;font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.15;color:var(--white);background:var(--plate);transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97);filter:brightness(.92)}
.btn.brass{background:var(--red-deep)}
.btn.ivory{background:var(--red)}
.btn.fold{background:#4a3340;color:#e7c9cf}
.btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor;opacity:.85}
.btn:disabled{opacity:.4;cursor:default}
.btn small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;opacity:.82;margin-top:2px}
.btn.sm{min-height:42px;font-size:14.5px;padding:8px 10px;border-radius:10px}
#home .btn.brass,.sheet .btn.brass{background:var(--red)}

/* ---------- Barre ---------- */
.bar{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px}
.bar .mark{font-size:22px;line-height:1}
.bar-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;padding-left:2px}
.bar-info{font-size:11.5px;font-weight:600;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{width:38px;height:38px;border-radius:12px;border:0;background:var(--plate);color:var(--white);font-size:18px;flex:none}
.chipbtn{flex:none;border:0;border-radius:12px;background:var(--white);color:var(--text);padding:9px 12px;font-size:13px;font-weight:700;box-shadow:0 1px 0 rgba(27,33,50,.06),0 6px 14px -6px rgba(27,33,50,.3)}

/* ---------- Table ---------- */
.arena{flex:1;position:relative;min-height:250px}
.felt{position:absolute;inset:6% 9%;border-radius:999px;background:radial-gradient(ellipse at 50% 45%,var(--felt) 0%,var(--felt-deep) 100%);border:9px solid var(--rail);box-shadow:inset 0 0 0 2px #556079,inset 0 0 40px rgba(0,40,45,.45),0 16px 30px -8px rgba(27,33,50,.45)}
.felt::after{content:"";position:absolute;inset:11px;border-radius:999px;border:2px solid rgba(255,255,255,.2)}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(calc(100% - 2*var(--podw) - 28px),340px);display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;pointer-events:none;color:var(--white)}
.pot{font-size:12px;font-weight:600;color:rgba(255,255,255,.85);display:flex;align-items:center;gap:7px}
.pot b{font-family:var(--f-display);font-weight:800;font-size:27px;letter-spacing:-.01em;color:var(--white);font-variant-numeric:tabular-nums;line-height:1;display:inline-flex;align-items:center;gap:6px;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.pot b::before{content:"";width:15px;height:15px;border-radius:50%;background:var(--accent);border:3px dashed var(--white);box-shadow:0 0 0 1.5px var(--rail)}
.board{display:flex;gap:4px;width:100%;justify-content:center;container-type:inline-size}
.board .card{--cw:min(56px,calc((100cqw - 16px)/5))}
.msg{font-size:13px;line-height:1.3;min-height:2.6em;text-wrap:balance;color:rgba(255,255,255,.95);font-weight:500}
.msg strong{color:var(--accent);font-weight:700}
.msg .street{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgba(15,45,50,.45);border-radius:999px;padding:2px 9px;margin-bottom:3px}
.lobby-code{font-family:var(--f-display);font-weight:800;font-variation-settings:"wdth" 80;font-size:40px;letter-spacing:.06em;color:var(--accent);line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.2)}

/* ---------- Cartes : gros index en haut à gauche, grande couleur en bas à droite ---------- */
.card{position:relative;display:inline-block;flex:none;width:var(--cw,44px);aspect-ratio:5/7;background:var(--white);color:#141a28;border-radius:calc(var(--cw,44px)*.13);font-family:var(--f-display);font-weight:800;font-variation-settings:"wdth" 82;box-shadow:0 0 0 1px rgba(27,33,50,.12),0 3px 8px rgba(10,30,40,.3);overflow:hidden}
.card.red{color:var(--red)}
.card>span{position:absolute;left:9%;top:3%;font-size:calc(var(--cw,44px)*.54);line-height:1;letter-spacing:-.07em}
.card .pip{position:absolute;right:7%;bottom:6%;width:56%;aspect-ratio:1;fill:currentColor;display:block}
.card.back{background:#ea3550;box-shadow:inset 0 0 0 calc(var(--cw,44px)*.09) #ff7d8f,0 0 0 1px rgba(27,33,50,.18),0 2px 6px rgba(10,30,40,.3)}
.card.slot{background:rgba(10,60,62,.35);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.2)}
.card.deal{animation:deal .38s cubic-bezier(.2,.8,.2,1) backwards}
.card.hl{box-shadow:0 0 0 3px var(--accent),0 6px 14px rgba(10,30,40,.45);transform:translateY(-4px)}
.card.dim{filter:brightness(.6)}
@keyframes deal{from{transform:translateY(-16px) scale(.88);opacity:0}}

/* ---------- Sièges ---------- */
.pod{position:absolute;transform:translate(-50%,-50%);width:var(--podw);left:clamp(calc(var(--podw)/2 + 7px),var(--x),calc(100% - var(--podw)/2 - 7px));top:clamp(48px,var(--y),calc(100% - 44px));text-align:center;border:0;background:none;padding:0;display:block;color:var(--white)}
.pod-top{display:flex;align-items:flex-end;justify-content:space-between;height:26px;padding:0 5px;margin-bottom:-7px;position:relative;z-index:0}
.pod-av{width:27px;height:27px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:14px;color:var(--white);border:2px solid var(--white);box-shadow:0 2px 5px rgba(27,33,50,.35)}
.pod-cards{display:flex;gap:1px}
.pod-cards .card{--cw:19px}
.pod-top.open{justify-content:center;height:34px}
.pod-top.open .pod-av{display:none}
.pod-top.open .card{--cw:28px}
.pod-body{display:block;position:relative;z-index:1;background:var(--plate);border:2px solid var(--plate);border-radius:11px;padding:3px 5px 5px;box-shadow:0 5px 12px -3px rgba(27,33,50,.55)}
.pod-name{display:block;font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e9ecf3}
.pod-stack{display:block;font-family:var(--f-display);font-weight:800;font-size:16px;line-height:1.05;color:var(--white);font-variant-numeric:tabular-nums}
.pod.me .pod-body{background:var(--white);border-color:var(--white)}
.pod.me .pod-name{color:var(--mute)}.pod.me .pod-stack{color:var(--text)}
.pod.turn .pod-body{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,201,40,.45),0 5px 12px -3px rgba(27,33,50,.55)}
.pod.win .pod-body{background:var(--accent);border-color:var(--accent)}
.pod.win .pod-name,.pod.win .pod-stack{color:#2b2204}
.pod.off{opacity:.5}
.pod-la{display:inline-block;max-width:100%;margin-top:3px;font-size:10.5px;font-weight:600;line-height:1.2;color:var(--white);background:rgba(27,33,50,.82);border-radius:8px;padding:2px 7px;text-wrap:balance}
.pod.win .pod-la{background:var(--plate)}
.pod-la b{font-family:var(--f-display);font-weight:800;font-size:11.5px;color:var(--accent);font-variant-numeric:tabular-nums}
.pod-d{display:inline-block;width:15px;height:15px;margin-right:4px;border-radius:50%;background:var(--accent);color:#2b2204;font-family:var(--f-display);font-style:normal;font-weight:800;font-size:10.5px;line-height:15px;text-align:center;vertical-align:1px;box-shadow:0 0 0 1.5px var(--rail)}
.pod-timer{position:absolute;left:8px;right:8px;bottom:1px;height:3px;border-radius:3px;background:var(--accent);transform-origin:left;animation:drain linear forwards}
.pod.me .pod-timer{background:var(--red)}
.pod.r .pod-top{flex-direction:row-reverse}
@keyframes drain{to{transform:scaleX(0)}}

/* ---------- Zone d'action ---------- */
.dock{flex:none;background:var(--plate);color:var(--white);border-radius:18px 18px 0 0;padding:12px 12px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 -10px 26px -14px rgba(27,33,50,.6)}
.dock.myturn{box-shadow:inset 0 3px 0 var(--accent),0 -10px 26px -14px rgba(27,33,50,.6)}
.dock-top{display:flex;gap:14px;align-items:center;min-height:66px}
.mycards{display:flex;flex:none;padding:0 6px 0 4px}
.mycards .card{--cw:54px;box-shadow:0 0 0 1px rgba(0,0,0,.2),0 6px 14px rgba(0,0,0,.45)}
.mycards .card:first-child{transform:rotate(-6deg)}
.mycards .card:last-child{transform:rotate(6deg);margin-left:-9px}
.mycards .card.slot{background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.18)}
.myinfo{min-width:0;flex:1}
.myhand{font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.15;letter-spacing:-.01em}
.hint{font-size:13px;color:var(--mute-on-dark);line-height:1.3;margin-top:2px;text-wrap:pretty}
.hint.you{color:var(--accent);font-weight:600}
.actions{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.actions .btn{padding-inline:6px;white-space:nowrap}
.actions .btn small{white-space:normal}
.dock .btn{background:var(--plate-2)}
.dock .btn.brass{background:var(--red-deep)}
.dock .btn.ivory{background:var(--red)}
.dock .btn.fold{background:#4a3340;color:#e7c9cf}
.dock .btn.ghost{background:transparent}
.dock label{color:var(--mute-on-dark)}
.stack-col{display:flex;flex-direction:column;gap:8px}
.note{font-size:14px;color:var(--mute-on-dark);text-align:center;padding:6px 4px;text-wrap:balance}
.raise{display:flex;flex-direction:column;gap:9px}
.raise-row{display:flex;align-items:center;gap:10px}
.raise-amt{flex:1;text-align:center;font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;color:var(--white);font-variant-numeric:tabular-nums;background:#151a27;border-radius:12px;padding:8px 6px}
.raise-amt small{display:block;font-family:var(--f-body);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute-on-dark);margin-bottom:3px}
.step{width:46px;height:46px;border-radius:12px;border:0;background:var(--plate-2);color:var(--white);font-size:22px;font-weight:700;flex:none}
input[type=range]{width:100%;height:34px;accent-color:var(--red);margin:0}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}

/* ---------- Feuilles ---------- */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(20,25,38,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{width:100%;max-width:520px;max-height:88%;overflow-y:auto;background:var(--white);color:var(--text);border-radius:22px 22px 0 0;padding:18px 18px 26px;display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-head .chipbtn{background:var(--bg);box-shadow:none}
.sheet h2{font-family:var(--f-display);font-weight:800;font-variation-settings:"wdth" 82;font-size:26px;letter-spacing:-.02em;line-height:1.05}
.sheet h3{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-top:4px}
.sheet p,.sheet li{font-size:14.5px;color:#3b4358;line-height:1.45}
.sheet ol,.sheet ul{padding-left:20px;display:flex;flex-direction:column;gap:6px}
.sheet b{color:var(--text)}
.codebox{background:var(--bg);border:1.5px dashed #c3c9d6;border-radius:14px;padding:14px;text-align:center}
.codebox span{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.codebox strong{font-family:var(--f-display);font-weight:800;font-size:42px;letter-spacing:.08em;color:var(--red);line-height:1;user-select:all}
.linkbox{font-size:13px!important;padding:11px 12px!important;color:var(--mute)!important;background:var(--bg)!important}
.ranks{display:flex;flex-direction:column;gap:7px}
.rank{display:flex;align-items:center;gap:10px}
.rank .rk-n{flex:none;width:20px;font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--red);text-align:right}
.rank .rk-c{display:flex;gap:2px;flex:none}
.rank .card{--cw:25px;box-shadow:0 0 0 1px rgba(27,33,50,.22)}
.rank .rk-t{min-width:0;font-size:13.5px;line-height:1.25}
.rank .rk-t b{display:block;font-size:14.5px}
.rank .rk-t span{color:var(--mute)}
.seg-row{display:flex;flex-direction:column;gap:6px}
.seg{display:flex;background:#e6e9f0;border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--mute);padding:10px 4px;border-radius:9px;font-weight:700;font-size:14px}
.seg button.on{background:var(--white);color:var(--text);box-shadow:0 1px 4px rgba(27,33,50,.2)}

.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:30;max-width:min(92%,440px);background:var(--plate);color:var(--white);font-weight:600;font-size:14px;border-radius:14px;padding:11px 16px;box-shadow:0 10px 30px rgba(27,33,50,.45);text-align:center;text-wrap:balance}

@media (max-height:620px){
  .mycards .card{--cw:46px}
  .dock-top{min-height:56px}
  .btn{min-height:46px}
}
@media (min-width:700px){
  :root{--podw:108px}
  .pod-name{font-size:14px}.pod-stack{font-size:19px}
  .pod-top{height:32px}.pod-av{width:33px;height:33px;font-size:16px}
  .pod-cards .card{--cw:24px}
  .pod-top.open{height:44px}.pod-top.open .card{--cw:36px}
  .mycards .card{--cw:64px}
}
@media (prefers-reduced-motion:reduce){
  .card.deal,.sheet-card{animation:none}
  .btn{transition:none}
}

</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="s0" viewBox="0 0 24 24"><path d="M12 2C9 6.6 3.4 9.6 3.4 14.2a4.3 4.3 0 0 0 7.4 3c-.2 1.9-.9 3.3-2.3 4.8h7c-1.4-1.5-2.1-2.9-2.3-4.8a4.3 4.3 0 0 0 7.4-3C20.6 9.6 15 6.6 12 2z"/></symbol>
  <symbol id="s1" viewBox="0 0 24 24"><path d="M12 21.5S3.9 16.2 2.1 10.9C.9 7.2 3.2 3.5 6.8 3.5c2 0 3.7 1 5.2 3.1 1.5-2.1 3.2-3.1 5.2-3.1 3.6 0 5.9 3.700 4.7 7.4C20.100 16.200 12 21.500 12 21.500z"/></symbol>
  <symbol id="s2" viewBox="0 0 24 24"><path d="M12 1.800 20.200 12 12 22.200 3.800 12z"/></symbol>
  <symbol id="s3" viewBox="0 0 24 24"><path d="M12 2.200a4.300 4.300 0 0 0-3.700 6.500 4.300 4.300 0 1 0 2.600 7.300c-.2 2.200-.9 3.900-2.400 5.500h7c-1.500-1.600-2.200-3.300-2.400-5.500a4.300 4.300 0 1 0 2.600-7.300A4.300 4.300 0 0 0 12 2.200z"/></symbol>
</svg>

<main id="home" class="view">
  <div class="home-in">
    <div class="fan" id="fan" aria-hidden="true"></div>
    <h1 class="mark">Tapis<i>.</i></h1>
    <p class="tag">Le poker entre amis. Tu crées la table, tu envoies le lien, vous jouez.</p>
    <form id="f-cfg" class="panel" hidden novalidate>
      <label for="cfgurl">Première fois : relie l'appli à ton projet Supabase</label>
      <input type="text" id="cfgurl" placeholder="https://xxxx.supabase.co" autocapitalize="none" autocomplete="off" spellcheck="false">
      <input type="text" id="cfgkey" placeholder="Clé « anon » / « publishable »" autocapitalize="none" autocomplete="off" spellcheck="false">
      <button class="btn brass" type="submit">Enregistrer</button>
      <p class="fine">Une seule fois. Le lien d'invitation transmet ces réglages à tes amis.</p>
    </form>
    <form id="f-create" class="panel" novalidate>
      <label for="pseudo">Ton pseudo</label>
      <input type="text" id="pseudo" maxlength="14" autocomplete="nickname" placeholder="Ex. Léa" enterkeyhint="go">
      <button class="btn brass" id="b-create" type="submit">Créer une table</button>
    </form>
    <form id="f-join" class="panel" novalidate>
      <label for="codein">Tu as reçu un code de table ?</label>
      <div class="inline">
        <input type="text" id="codein" maxlength="12" placeholder="ex. k7m2qd" autocapitalize="none" autocomplete="off" spellcheck="false" enterkeyhint="go">
        <button class="btn" type="submit">Rejoindre</button>
      </div>
    </form>
    <p class="fine">Texas Hold'em sans limite, de 2 à 8 joueurs. Jetons fictifs, aucune mise d'argent. <button type="button" class="link" data-a="rules">Voir les règles</button></p>
  </div>
</main>

<main id="table" class="view" hidden>
  <header class="bar">
    <button type="button" class="icon" data-a="leave" aria-label="Quitter la table">&#8592;</button>
    <div class="bar-mid"><span class="mark">Tapis<i>.</i></span><span id="barinfo" class="bar-info"></span></div>
    <button type="button" class="chipbtn" data-a="rules">Règles</button>
    <button type="button" class="chipbtn" id="b-invite" data-a="invite">Inviter</button>
    <button type="button" class="chipbtn" id="b-host" data-a="hostmenu" hidden>Hôte</button>
  </header>
  <div class="arena">

<script>
'use strict';
/* ===================== MOTEUR : Texas Hold'em No Limit ===================== */
/* Carte = entier 0..51 ; rang = c>>2 (0 = Deux … 12 = As) ; couleur = c&3 (0 pique, 1 coeur, 2 carreau, 3 trèfle) */
var RK = ['2', '3', '4', '5', '6', '7', '8', '9', '10', 'V', 'D', 'R', 'A'];
var RN1 = ['Deux', 'Trois', 'Quatre', 'Cinq', 'Six', 'Sept', 'Huit', 'Neuf', 'Dix', 'Valet', 'Dame', 'Roi', 'As'];
var RNP = ['Deux', 'Trois', 'Quatre', 'Cinq', 'Six', 'Sept', 'Huit', 'Neuf', 'Dix', 'Valets', 'Dames', 'Rois', 'As'];
var CATS = ['Hauteur', 'Paire', 'Deux paires', 'Brelan', 'Quinte', 'Couleur', 'Full', 'Carré', 'Quinte flush'];

function frDe(w) { return (w === 'As' ? "d'" : 'de ') + w; }
function frAu(r) { return r === 12 ? "à l'As" : r === 10 ? 'à la Dame' : 'au ' + RN1[r]; }

/* Score d'une main de 5 cartes : catégorie puis départages, en base 13 */
function eval5(cs) {
  var rs = [cs[0] >> 2, cs[1] >> 2, cs[2] >> 2, cs[3] >> 2, cs[4] >> 2].sort(function (a, b) { return b - a; });
  var f = cs[0] & 3;
  var flush = (cs[1] & 3) === f && (cs[2] & 3) === f && (cs[3] & 3) === f && (cs[4] & 3) === f;
  var cnt = {}, i;
  for (i = 0; i < 5; i++) cnt[rs[i]] = (cnt[rs[i]] || 0) + 1;
  var g = Object.keys(cnt).map(Number).sort(function (a, b) { return cnt[b] - cnt[a] || b - a; });
  var sh = -1;
  if (g.length === 5) {
    if (rs[0] - rs[4] === 4) sh = rs[0];
    else if (rs[0] === 12 && rs[1] === 3 && rs[4] === 0) sh = 3; /* A-2-3-4-5 : quinte au Cinq */
  }
  var cat, tb;
  if (sh >= 0 && flush) { cat = 8; tb = [sh]; }
  else if (cnt[g[0]] === 4) { cat = 7; tb = g; }
  else if (cnt[g[0]] === 3 && cnt[g[1]] === 2) { cat = 6; tb = g; }
  else if (flush) { cat = 5; tb = rs; }
  else if (sh >= 0) { cat = 4; tb = [sh]; }
  else if (cnt[g[0]] === 3) { cat = 3; tb = g; }
  else if (cnt[g[0]] === 2 && cnt[g[1]] === 2) { cat = 2; tb = g; }
  else if (cnt[g[0]] === 2) { cat = 1; tb = g; }
  else { cat = 0; tb = rs; }
  var s = cat;
  for (i = 0; i < 5; i++) s = s * 13 + (tb[i] || 0);
  return s;
}

function handName(score) {
  var tb = [], s = score, i;
  for (i = 0; i < 5; i++) { tb.unshift(s % 13); s = Math.floor(s / 13); }
  var cat = s;
  switch (cat) {
    case 8: return tb[0] === 12 ? 'Quinte flush royale' : 'Quinte flush ' + frAu(tb[0]);
    case 7: return 'Carré ' + frDe(RNP[tb[0]]);
    case 6: return 'Full aux ' + RNP[tb[0]] + ' par les ' + RNP[tb[1]];
    case 5: return 'Couleur ' + frAu(tb[0]);
    case 4: return 'Quinte ' + frAu(tb[0]);
    case 3: return 'Brelan ' + frDe(RNP[tb[0]]);
    case 2: return 'Deux paires, ' + RNP[tb[0]] + ' et ' + RNP[tb[1]];
    case 1: return 'Paire ' + frDe(RNP[tb[0]]);
    default: return 'Hauteur ' + RN1[tb[0]];
  }
}

/* Meilleure main de 5 cartes parmi 5, 6 ou 7 (2 cartes : paire ou hauteur, pour l'aide avant le flop) */
function bestHand(cards) {
  var n = cards.length;
  if (n < 5) {
    var a = cards[0] >> 2, b = cards[1] >> 2, hi = Math.max(a, b), lo = Math.min(a, b);
    var sc = a === b ? 1 * 371293 + a * 28561 : hi * 28561 + lo * 2197;
    return { score: sc, cards: cards.slice(), cat: a === b ? 1 : 0, name: a === b ? 'Paire ' + frDe(RNP[a]) : 'Hauteur ' + RN1[hi] };
  }
  var best = -1, bc = null, c = [0, 0, 0, 0, 0], i, j, k, l, m, s;
  for (i = 0; i < n - 4; i++) for (j = i + 1; j < n - 3; j++) for (k = j + 1; k < n - 2; k++)
    for (l = k + 1; l < n - 1; l++) for (m = l + 1; m < n; m++) {
      c[0] = cards[i]; c[1] = cards[j]; c[2] = cards[k]; c[3] = cards[l]; c[4] = cards[m];
      s = eval5(c);
      if (s > best) { best = s; bc = c.slice(); }
    }
  return { score: best, cards: bc, cat: Math.floor(best / 371293), name: handName(best) };
}

/* ---------- Aléatoire et mélange ---------- */
function randInt(n) {
  var c = (typeof crypto !== 'undefined' && crypto.getRandomValues) ? crypto : null;
  if (!c) return Math.floor(Math.random() * n);
  var lim = Math.floor(4294967296 / n) * n, b = new Uint32Array(1);
  do { c.getRandomValues(b); } while (b[0] >= lim);
  return b[0] % n;
}
function newDeck() {
  var d = [], i, j, t;
  for (i = 0; i < 52; i++) d.push(i);
  for (i = 51; i > 0; i--) { j = randInt(i + 1); t = d[i]; d[i] = d[j]; d[j] = t; }
  return d;
}

/* ---------- Table ---------- */
function newSeat(id, name, stack, bot) {
  return { id: id, name: name, stack: stack, bot: bot ? 1 : 0, bet: 0, tot: 0, 'in': 0, fold: 0, ai: 0, seen: -1, la: '', away: 0, pk: '', rb: 0, bk: 0, qt: 0 };
}
function newTable(code, hostId, cfg) {
  return {
    v: 0, code: code, hostId: hostId, hostInst: '', cfg: cfg, status: 'lobby', paused: 0,
    seats: [], hand: 0, street: 'lobby', btn: -1, sbI: -1, bbI: -1, turn: -1, cur: 0, minR: cfg.bb,
    board: [], seq: 0, pending: '', runout: 0, eph: '', enc: {}, shown: {}, res: 0
  };
}
function canPlay(s) { return s.stack > 0 && !s.away; }
function liveSeats(S) { return S.seats.filter(function (s) { return s['in'] && !s.fold; }); }
function potTotal(S) { var t = 0; S.seats.forEach(function (s) { t += s.tot; }); return t; }
function nextIn(S, i) {
  var n = S.seats.length, k, j;
  for (k = 1; k <= n; k++) { j = (i + k) % n; if (S.seats[j]['in']) return j; }
  return -1;
}
function pay(p, amt) {
  amt = Math.min(amt, p.stack);
  p.stack -= amt; p.bet += amt; p.tot += amt;
  if (p.stack === 0) p.ai = 1;
}

/* Ce qu'un joueur a face à lui : la plus grosse mise adverse et le nombre d'adversaires encore capables de miser */
function facing(S, i) {
  var maxOther = 0, others = 0;
  S.seats.forEach(function (s, j) {
    if (j !== i && s['in'] && !s.fold) { if (s.bet > maxOther) maxOther = s.bet; if (!s.ai) others++; }
  });
  return { maxOther: maxOther, others: others };
}
function needsAct(S, i) {
  var p = S.seats[i];
  if (!p['in'] || p.fold || p.ai) return false;
  var f = facing(S, i);
  if (p.bet < f.maxOther) return true;
  if (f.others > 0 && (p.seen < 0 || p.bet < S.cur)) return true;
  return false;
}
function nextToAct(S, from) {
  var n = S.seats.length, k, j;
  for (k = 1; k <= n; k++) { j = (from + k) % n; if (needsAct(S, j)) return j; }
  return -1;
}

/* Actions permises pour le joueur i */
function legal(S, i) {
  var p = S.seats[i], f = facing(S, i);
  var callTo = f.others > 0 ? S.cur : Math.min(S.cur, f.maxOther);
  var owe = Math.max(0, callTo - p.bet);
  var maxTo = p.bet + p.stack;
  /* Relance permise si le joueur n'a pas encore parlé, ou si la mise a monté d'au moins une relance complète depuis */

  function playHTML(me, i) {

    if (refresh && ui.sheet !== kind) return;
    ui.sheet = kind;
    if (refresh && document.activeElement && $('sheet-card').contains(document.activeElement) && document.activeElement.tagName === 'INPUT') return;
    put('sheet-card', h);
    $('sheet').hidden = false;
  }
  function RULES_HTML() {
    var rows = [
      ['Quinte flush royale', 'Dix à l\'As, même couleur', [32, 36, 40, 44, 48]],
      ['Quinte flush', 'Cinq cartes qui se suivent, même couleur', [17, 21, 25, 29, 33]],
      ['Carré', 'Quatre cartes de même valeur', [44, 45, 46, 47, 14]],
      ['Full', 'Un brelan et une paire', [40, 41, 42, 20, 23]],
      ['Couleur', 'Cinq cartes de la même couleur', [50, 38, 30, 18, 6]],
      ['Quinte', 'Cinq cartes qui se suivent', [16, 21, 26, 31, 32]],
      ['Brelan', 'Trois cartes de même valeur', [28, 29, 31, 46, 9]],
      ['Deux paires', 'Deux fois deux cartes identiques', [48, 51, 24, 26, 41]],
      ['Paire', 'Deux cartes de même valeur', [36, 39, 49, 22, 12]],
      ['Hauteur', 'Aucune combinaison : la plus haute carte compte', [48, 37, 26, 15, 4]]
    ];
    var h = '<p>Chacun reçoit <b>2 cartes privées</b>. Cinq cartes communes sont dévoilées au centre. La meilleure main de <b>5 cartes</b> parmi les 7 gagne le pot, ou le dernier joueur qui ne s\'est pas couché.</p>' +
      '<h3>Une main en 4 tours de mises</h3><ol><li><b>Avant le flop</b> : les deux joueurs à gauche du donneur (D) posent les blindes, puis chacun parle.</li>' +
      '<li><b>Flop</b> : 3 cartes communes.</li><li><b>Tournant</b> : une 4e carte.</li><li><b>Rivière</b> : la 5e carte, puis on montre les jeux.</li></ol>' +
      '<h3>À ton tour</h3><ul><li><b>Parole</b> : tu passes sans miser, possible si personne n\'a misé.</li><li><b>Suivre</b> : tu égalises la mise en cours.</li>' +
      '<li><b>Miser / Relancer</b> : tu fais monter la mise. Une relance doit être au moins aussi grosse que la précédente.</li>' +
      '<li><b>Se coucher</b> : tu abandonnes la main et tes mises.</li><li><b>Tapis</b> : tu mises tous tes jetons. Tu ne peux gagner que la part du pot que tu as couverte.</li></ul>' +
      '<h3>Les mains, de la plus forte à la plus faible</h3><div class="ranks">';
    rows.forEach(function (r, k) {
      h += '<div class="rank"><span class="rk-n">' + (k + 1) + '</span><span class="rk-c">' + r[2].map(function (c) { return card(c); }).join('') + '</span><span class="rk-t"><b>' + r[0] + '</b><span>' + r[1] + '</span></span></div>';
    });
    return h + '</div><p>En cas d\'égalité de combinaison, les cartes les plus hautes départagent. Égalité parfaite : le pot est partagé.</p>';
  }

  /* ===================== Événements ===================== */
  document.addEventListener('click', function (ev) {
    if (ev.target === $('sheet')) { closeSheet(); return; }
    var el = ev.target.closest ? ev.target.closest('[data-a]') : null;
    if (!el || el.disabled) return;
    var a = el.getAttribute('data-a'), i, s, L;
    switch (a) {
      case 'rules': openSheet('rules'); break;
      case 'close': closeSheet(); break;
      case 'invite': openSheet('invite'); break;
      case 'settings': if (isHost) openSheet('settings'); break;
      case 'hostmenu': if (isHost) openSheet('host'); break;
      case 'leave': if (S && myIdx() >= 0) openSheet('leave'); else goHome(); break;
      case 'quit': quitTable(); break;
      case 'copy':
        var lb = $('linkbox'); if (!lb) break;
        try {
          navigator.clipboard.writeText(lb.value).then(function () { toast('Lien copié. Envoie-le à tes amis.', 2500); }, function () { lb.focus(); lb.select(); toast('Appuie longuement sur le lien pour le copier.'); });
        } catch (e) { lb.focus(); lb.select(); toast('Appuie longuement sur le lien pour le copier.'); }
        break;
      case 'start': hostStart(); break;
      case 'bot': addBot(); break;
      case 'cfg':
        if (!isHost) break;
        var k = el.getAttribute('data-k'), v = el.getAttribute('data-v');
        if (k === 'timer') S.cfg.timer = +v;
        else if (S.status === 'lobby') {
          if (k === 'stack') { S.cfg.stack = +v; S.seats.forEach(function (x) { x.stack = +v; }); }
          if (k === 'blinds') { S.cfg.sb = +v.split('-')[0]; S.cfg.bb = +v.split('-')[1]; S.minR = S.cfg.bb; }
        }
        publish(); if (k === 'timer') armTurn();
        break;
      case 'pause':
        if (!isHost) break;
        S.paused = S.paused ? 0 : 1; publish(); closeSheet();
        if (!S.paused) hostResume();
        break;
      case 'blinds': if (isHost) { nextBlinds = [S.cfg.sb * 2, S.cfg.bb * 2]; openSheet('host'); } break;
      case 'seat':
        i = +el.getAttribute('data-i');
        if (isHost && S && S.seats[i] && S.seats[i].id !== myId) openSheet('seat', false, i);
        break;
      case 'skip':
        i = +el.getAttribute('data-i'); closeSheet();
        if (isHost && S.turn === i && !S.pending) { if (!S.seats[i].bot) S.seats[i].away = 1; act(S, P, i, legal(S, i).check ? 'check' : 'fold'); afterHost(); }
        break;
      case 'kick':
        i = +el.getAttribute('data-i'); closeSheet();
        if (!isHost || !S.seats[i]) break;
        if (between() && S.status === 'lobby') removeSeat(i);
        else if (between()) { removeSeat(i); }
        else { S.seats[i].rm = 1; S.seats[i].away = 1; if (S.turn === i) armTurn(); }
        publish(); if (S.street === 'wait') scheduleNext();
        break;
      case 'fold': sendAct('fold'); break;
      case 'check': sendAct('check'); break;
      case 'call': sendAct('call'); break;
      case 'raise-open':
        if (!myTurn()) break;
        L = legal(S, myIdx()); ui.raise = true; ui.raiseTo = L.minTo; render();
        break;
      case 'r-cancel': ui.raise = false; render(); break;
      case 'r-ok': sendAct('raise', ui.raiseTo); break;
      case 'r-minus': setRaise(ui.raiseTo - S.cfg.bb); break;
      case 'r-plus': setRaise(ui.raiseTo + S.cfg.bb); break;
      case 'r-set':
        L = legal(S, myIdx()); i = myIdx(); s = potTotal(S); v = el.getAttribute('data-v');
        setRaise(v === 'min' ? L.minTo : v === 'max' ? L.maxTo : v === 'pot' ? S.cur + s + L.owe : S.cur + Math.round((s + L.owe) / 2));
        break;
      case 'rebuy': bump('rb'); break;
      case 'imback': bump('bk'); break;
    }
  });
  document.addEventListener('input', function (ev) {
    if (ev.target.id === 'r-range' && S && myTurn()) {
      var L = raiseBounds(), f = +ev.target.value / 1000, to = L.minTo + f * (L.maxTo - L.minTo), u = S.cfg.sb;
      to = f >= 1 ? L.maxTo : f <= 0 ? L.minTo : Math.round(to / u) * u;
      ui.raiseTo = Math.max(L.minTo, Math.min(L.maxTo, to)); syncRaise();
    }
  });
  document.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var id = ev.target.id;
    if (id === 'f-create') {
      if (!capsReady) { toast('Connexion en cours, réessaie dans un instant.'); return; }
      var nm = cleanName($('pseudo').value);
      if (!nm) { toast('Choisis un pseudo pour créer la table.'); $('pseudo').focus(); return; }
      ls.set('tapis-name', nm); createTable(nm);
    } else if (id === 'f-join') {
      var c = $('codein').value.toLowerCase().replace(/[^a-z0-9]/g, '');
      if (c.length < 4) { toast('Entre le code reçu, par exemple k7m2qd.'); $('codein').focus(); return; }
      location.hash = 'table-' + c;
    } else if (id === 'f-sit') sit($('sitname').value);
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && ui.sheet) closeSheet(); });

  boot();
})();

</script>
